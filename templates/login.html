{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Вход</h2>
    <form method="POST">
        <input name="username" placeholder="Логин" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button class="btn">Войти</button>
    </form>
    <p>Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
</div>
{% endblock %}
